<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株吉</title>

  <style>

    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      color: white;

      background:
        linear-gradient(
          135deg,
          #0f172a,
          #111827,
          #052e16
        );

      min-height: 100vh;
    }

    .header {
      text-align: center;
      margin-top: 30px;
      margin-bottom: 50px;
    }

    .title {

      font-size: 72px;
      font-weight: bold;
      margin: 0;

      color: #4ade80;

      text-shadow:
        0 0 10px rgba(74,222,128,0.8),
        0 0 20px rgba(74,222,128,0.6),
        0 0 40px rgba(74,222,128,0.4);

      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {

      from {
        text-shadow:
          0 0 10px rgba(74,222,128,0.7),
          0 0 20px rgba(74,222,128,0.5);
      }

      to {
        text-shadow:
          0 0 20px rgba(74,222,128,1),
          0 0 40px rgba(74,222,128,0.8),
          0 0 60px rgba(74,222,128,0.6);
      }
    }

    .subtitle {
      margin-top: 15px;
      font-size: 20px;
      color: #d1d5db;
      letter-spacing: 2px;
    }

    .container {

      display: grid;
      gap: 25px;

      max-width: 800px;
      margin: auto;
    }

    .card {

      background:
        rgba(30,30,30,0.7);

      backdrop-filter: blur(10px);

      border:
        1px solid rgba(255,255,255,0.08);

      padding: 28px;

      border-radius: 24px;

      box-shadow:
        0 8px 24px rgba(0,0,0,0.5);

      transition:
        transform 0.25s,
        box-shadow 0.25s;
    }

    .card:hover {

      transform:
        translateY(-6px)
        scale(1.01);

      box-shadow:
        0 14px 32px rgba(0,0,0,0.6);
    }

    .card h2 {

      margin-top: 0;
      margin-bottom: 12px;

      font-size: 28px;

      color: white;
    }

    .card p {

      color: #cbd5e1;

      margin-bottom: 24px;

      line-height: 1.6;
    }

    .card a {

      display: inline-block;

      text-decoration: none;

      background:
        linear-gradient(
          135deg,
          #22c55e,
          #16a34a
        );

      color: white;

      padding: 12px 22px;

      border-radius: 14px;

      font-weight: bold;

      transition:
        transform 0.2s,
        opacity 0.2s,
        box-shadow 0.2s;

      box-shadow:
        0 4px 12px rgba(34,197,94,0.4);
    }

    .card a:hover {

      transform: scale(1.05);

      opacity: 0.9;

      box-shadow:
        0 6px 18px rgba(34,197,94,0.6);
    }

    @media (max-width: 600px) {

      .title {
        font-size: 52px;
      }

      .card h2 {
        font-size: 22px;
      }
    }

  </style>

</head>

<body>

  <div class="header">

    <h1 class="title">
      株吉
    </h1>

    <p class="subtitle">
      株ツール集
    </p>

  </div>

  <div class="container">

    <div class="card">

      <h2>
        積立オルカンシミュレーター
      </h2>

      <p>
        積立投資の将来資産をシミュレーション
      </p>

      <a
        href="https://fantagrapepe.github.io/orukan-simulator/"
        target="_blank"
      >
        開く
      </a>

    </div>

    <div class="card">

      <h2>
        ナンピン計算
      </h2>

      <p>
        ナンピン後の平均取得単価を計算
      </p>

      <a
        href="https://fantagrapepe.github.io/nanpin-app/"
        target="_blank"
      >
        開く
      </a>

    </div>

    <div class="card">

      <h2>
        配当計算
      </h2>

      <p>
        配当利回り、優待利回りを計算
      </p>

      <a
        href="https://fantagrapepe.github.io/yield-app/"
        target="_blank"
      >
        開く
      </a>

    </div>

    <div class="card">

      <h2>
        保有銘柄
      </h2>

      <p>
        保有銘柄全体の総合利回りを管理
      </p>

      <a
        href="https://fantagrapepe.github.io/total-yield-app/"
        target="_blank"
      >
        開く
      </a>

    </div>

    <div class="card">

      <h2>
        欲しい株リスト
      </h2>

      <p>
        欲しい株の現在株価、目標株価、利回りを管理
      </p>

      <a
        href="https://fantagrapepe.github.io/wishlist-app/"
        target="_blank"
      >
        開く
      </a>

    </div>

  </div>

</body>
</html>
